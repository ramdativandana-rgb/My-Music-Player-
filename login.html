<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music Player - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-page">

        <!-- Left sidee -->
        <section class="visual-section">

            <div class="music-grid">

                <div class="music-card card-1"></div>
                <div class="music-card card-2"></div>
                <div class="music-card card-3"></div>
                <div class="music-card card-4"></div>
                <div class="music-card card-5"></div>
                <div class="music-card card-6"></div>

            </div>

            <div class="visual-overlay"></div>

            <div class="hero-text">
                <h1>
                    Every sound<br>
                    has a story.
                </h1>

                <p>
                    Start listening. Discover yours.
                </p>
            </div>

        </section>


        <!-- Right side --> 
        <section class="login-section">

            <div class="login-container">

            
                <div class="brand">
                    <div class="brand-icon">
                        🎧
                    </div>

                    <span>My Music Player</span>
                </div>


                <!-- HEADING -->
                <div class="welcome">
                    <h2>Welcome back</h2>

                    <p>
                        Sign in to continue listening.
                    </p>
                </div>


                
                <div class="social-buttons">

                    <button class="social-btn google-btn">
                        <span class="google-icon">G</span>
                        <span>Continue with Google</span>
                    </button>

                    <button class="social-btn apple-btn">
                        <span class="apple-icon">●</span>
                        <span>Continue with Apple</span>
                    </button>

                </div>


                <!-- DIVIDER -->
                <div class="divider">
                    <span></span>
                    <p>or</p>
                    <span></span>
                </div>


                <!-- LOGIN FORM -->
                <form action="/login" method="POST">

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>

                            <a href="#" class="forgot">
                                Forgot password?
                            </a>

                        </div>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword()">
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- SIGN IN -->
                    <button type="submit" class="signin-btn">
                        Sign in
                    </button>

                </form>


                <!-- SIGN UP -->
                <div class="signup">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="#">
                        Sign up free
                    </a>

                </div>


                <!-- CONTINUE WITHOUT ACCOUNT -->
                <div class="guest-login">
                    <a href="/home">
                        Continue without account
                    </a>
                </div>

            </div>

        </section>

    </div>


    <!-- PASSWORD SCRIPT -->
    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "Hide";

            } else {

                password.type = "password";
                button.textContent = "Show";

            }
        }

    </script>

</body>
</html>
